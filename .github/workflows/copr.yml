name: COPR
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('{0} {1}', inputs.operation == 'build' && 'Publish' || 'Project', inputs.package) || format('Check all packages ({0})', github.event_name) }}

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Create the selected project, or build and publish its package
        type: choice
        options: [project, build]
        default: project
        required: true
      package:
        description: Package to publish independently
        type: choice
        options: [blesh, nimbus, voxtype, github-copilot-installer, wowup-cf-installer]
        default: nimbus
        required: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ github.event_name == 'workflow_dispatch' && format('Check {0} and shared tooling', inputs.package) || 'Check all packages' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: docker build -t copr-tools -f build/Containerfile .
      - name: Run the complete offline gate
        if: github.event_name != 'workflow_dispatch'
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/work \
            -v "$GITHUB_WORKSPACE:/work:ro" copr-tools just check
      - name: Run selected package checks
        if: github.event_name == 'workflow_dispatch'
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/work \
            -v "$GITHUB_WORKSPACE:/work:ro" copr-tools just check-package "$PACKAGE"

  publish:
    name: ${{ format('{0} {1}', inputs.operation == 'build' && 'Publish' || 'Project', inputs.package) }}
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: copr-publish-${{ inputs.package }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - run: docker build -t copr-tools -f build/Containerfile .
      - name: Compile publication tooling without credentials
        run: |
          mkdir -p "$RUNNER_TEMP/copr-tools"
          docker run --rm --network none --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE:/work:ro" -v "$RUNNER_TEMP/copr-tools:/tools" \
            copr-tools go build -o /tools/coprctl ./cmd/coprctl
      - name: Prepare selected source RPM
        if: inputs.operation == 'build'
        shell: bash
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/copr-srpm"
          arguments=(prepare "$PACKAGE" /output)
          if [[ "$PACKAGE" == github-copilot-installer ]]; then
            arguments+=(--latest)
          fi
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE:/work:ro" -v "$RUNNER_TEMP/copr-tools:/tools:ro" \
            -v "$RUNNER_TEMP/copr-srpm:/output" \
            copr-tools /tools/coprctl "${arguments[@]}"
      - name: Create project or submit build
        shell: bash
        env:
          COPR_OWNER: ${{ vars.COPR_OWNER }}
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
          OPERATION: ${{ inputs.operation }}
          PACKAGE: ${{ inputs.package }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/copr-srpm"
          arguments=(project "$PACKAGE")
          if [[ "$OPERATION" == project ]]; then
            :
          elif [[ "$OPERATION" == build ]]; then
            shopt -s nullglob
            packages=("$RUNNER_TEMP"/copr-srpm/*.src.rpm)
            [[ ${#packages[@]} == 1 ]]
            arguments=(publish "$PACKAGE" "/input/${packages[0]##*/}")
          else
            exit 1
          fi
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e COPR_OWNER -e COPR_CONFIG \
            -v "$GITHUB_WORKSPACE:/work:ro" -v "$RUNNER_TEMP/copr-tools:/tools:ro" \
            -v "$RUNNER_TEMP/copr-srpm:/input:ro" \
            copr-tools /tools/coprctl "${arguments[@]}"
